<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Horas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de Horas</h1>

    <label>Hora de início:</label>
    <input type="time" id="inicio">

    <p>Duração:</p>
    <label><input type="radio" name="duracao" value="09:30" checked> 9h30</label>
    <label><input type="radio" name="duracao" value="10:00"> 10h00</label>

    <br><br>
    <button onclick="calcular()">Calcular</button>

    <h2>Horário de saída: <span id="saida">--:--</span></h2>

    <h2>Histórico</h2>
    <div id="historico"></div>

    <script src="app.js"></script>
</body>
</html>
